# Diagnóstico: comprueba qué tiendas responden desde las IPs de GitHub.
# Se lanza a mano (Actions → sonda → Run workflow) o al cambiar la propia sonda.
name: sonda
on:
  workflow_dispatch:
  push:
    paths: [bot/sonda.py, .github/workflows/sonda.yml]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Probar tiendas
        run: |
          uv run python -m bot sonda | tee sonda.txt
          # Resultado también como anotación, visible en el resumen del run
          echo "::notice title=sonda::$(sed ':a;N;$!ba;s/\n/%0A/g' sonda.txt)"
