# Configuración del bot. Se puede cambiar sin tocar código.

aviso:
  # Modo activo: "precio_final" o "porcentaje"
  modo: precio_final
  precio_final:
    referencia_min: 700   # el producto debe valer normalmente al menos esto (€)
    precio_max: 330       # y aparecer a este precio o menos (€)
  porcentaje:
    caida_min: 50         # % mínimo de caída respecto a la referencia

referencia:
  dias: 30                # ventana del historial para las medianas
  min_dias_propios: 3     # días de historial propio necesarios para usarlo

red:
  concurrencia_global: 4
  concurrencia_por_tienda: 1
  pausa_min: 1.0          # segundos entre peticiones a la misma tienda
  pausa_max: 3.0
  pausas_por_host:        # pausas más largas para tiendas delicadas [mín, máx] en segundos
    www.pccomponentes.com: [5.0, 10.0]
  timeout: 20
  reintentos: 2

# Datos compartidos entre Actions y la tarea local (bot/compartidos.py): avisos ya
# enviados, para no recibir dos veces el mismo chollo, y los productos de las tiendas
# solo_local (PcComponentes), que Actions importa para la web.
avisos_compartidos:
  url_actions: https://raw.githubusercontent.com/TryTrick/bot-precios/datos/avisos.json
  url_local: https://raw.githubusercontent.com/TryTrick/bot-precios/datos-local/avisos.json
  url_locales: https://raw.githubusercontent.com/TryTrick/bot-precios/datos-local/tiendas_locales.json

# Tarea programada de Windows (tiendas solo_local), ver README
tarea_local:
  bateria_min: 20         # % mínimo para empezar si el portátil va sin cargador

tienda_rota:
  ciclos_fallidos: 3      # fallos (o 0 productos) seguidos antes de avisar
  horas_entre_emails: 24  # como mucho un email por tienda en este periodo

rastreo:
  # Los listados se recorren por precio ascendente hasta superar este precio, así se ven
  # todos los productos que podrían disparar el aviso en modo precio_final.
  barrido_hasta: 330
  max_paginas_barrido: 15   # por categoría y ciclo (MediaMarkt: 12 productos/página)
  paginas_rotacion: 1       # páginas extra del resto del catálogo por categoría y ciclo

# Categorías vigiladas (los nombres internos se usan en cada tienda)
categorias: [moviles, portatiles, tablets, relojes, auriculares, consolas, graficas, monitores]

# Tiendas activas. Poner activa: false para desactivar una sin tocar código.
# solo_local: true = se salta en GitHub Actions (la tienda bloquea las IPs de GitHub).
tiendas:
  pccomponentes: {activa: true, solo_local: true}
  mediamarkt: {activa: true}
  chollometro: {activa: true}
  samsung: {activa: true}
  amazon: {activa: false}   # 503 anti-robot; se cubre con Chollometro
  apple: {activa: true}     # iPhone e iPad
  xiaomi: {activa: true}    # parcial: solo precio "desde" por familia
