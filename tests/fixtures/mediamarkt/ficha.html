f": "CofrRefurbishedGoodsFeature:Media:es:1620285"}}, "productId": "1620285", "displayName": "Samsung Galaxy S26 Ultra, Negro, 1 TB, 16 GB RAM, 6.9\" QHD+, Qualcomm Snapdragon 8 Elite Gen 5, 5000 mAh, Android 16", "imageId": "ASSET_MMS_171733011", "imageUrl": "https://assets.mmsrg.com/isr/166325/c1/-/ASSET_MMS_171733011", "variantValue": "16 GB RAM + 1 TB", "product": {"__ref": "GraphqlProduct:Media:es-ES:1620285"}}]}], "additionalInformation": null, "retailRestrictions": [], "tax": 21, "productGroupId": 3902, "description": "<p>El Samsung Galaxy S26 Ultra representa la experiencia más avanzada de la serie: una pantalla de gran formato, un rendimiento preparado para las tareas más exigentes y un sistema de cámaras pensado para quienes buscan el máximo en fotografía y vídeo. Diseñado para un uso intensivo, combina innovación, autonomía y prestaciones de alto nivel en un solo dispositivo.</p>\n\n<h3>Una pantalla sin concesiones</h3>\n<p>El Galaxy S26 Ultra incorpora una impresionante <b>pantalla de 6,9 pulgadas</b> con resolución <b>QHD+ (3120 x 1440)</b> y tecnología <b>Dynamic AMOLED 2X</b>, que ofrece una visualización amplia, detallada y fluida gracias a su <b>tasa de refresco de 120 Hz</b>, ideal para contenido multimedia, productividad y gaming.</p>\n\n<h3>Rendimiento al máximo nivel</h3>\n<p>En su interior, el <b>Qualcomm Snapdragon 8 Elite Gen 5</b> ofrece un <b>rendimiento rápido y muy fluido</b>, preparado para juegos exigentes, multitarea intensiva y aplicaciones avanzadas, con una respuesta inmediata y una gestión eficiente del consumo energético.</p>\n\n<h3>Almacenamiento amplio y autonomía de alto nivel</h3>\n<p>Con <b>256 GB de almacenamiento interno</b> y <b>12 GB de RAM</b>, el Galaxy S26 Ultra ofrece espacio y fluidez para un uso profesional y creativo. Su <b>batería de 5000 mAh</b>, junto con la <b>carga rápida de 60 W</b>, está pensada para largas jornadas sin interrupciones.</p>\n\n<h3>Fotografía profesional en tu bolsillo</h3>\n<p>El sistema de cámaras del Galaxy S26 Ultra eleva la fotografía móvil a otro nivel con una <b>cámara principal de 200 MP (F1.4) con OIS</b>, un <b>teleobjetivo de 50 MP (F2.9) con zoom óptico x5 y OIS</b>, un <b>ultra gran angular de 50 MP (F1.9)</b> y un <b>teleobjetivo adicional de 10 MP (F2.4) con zoom óptico x3 y OIS</b>. En la parte frontal, la <b>cámara de 12 MP (F2.2)</b> garantiza selfies y videollamadas con gran nivel de detalle.</p>\n\n<h3>Colores que reflejan su carácter premium</h3>\n<p>El Samsung Galaxy S26 Ultra está disponible en <b>Black</b>, <b>Light Blue</b>, <b>Violet</b> y <b>White</b>, una gama de colores elegante y sofisticada que acompaña su diseño de alta gama.</p>", "descriptionMarketing": null, "accessoriesRelated": [], "hasDataEraseCode": false, "predecessorProductIds": [], "predecessor": null, "successorProductIds": [], "successor": null, "assetSafetyInformationDocuments": [{"__typename": "GraphqlProductAsset", "link": "https://assets.mmsrg.com/ada/166325/c1/-/-/ASSET_MMS_172130463", "pixelboxxId": "ASSET_MMS_172130463", "altText": "Guía de usuario para dispositivos Samsung con números."}], "assetCeConformityDeclarations": [], "manufacturerLegalContact": {"__typename": "GraphqlManufacturerLegalContact", "legalName": "Samsung Electronics Iberia, S.A., Sociedad Unipersonal", "email": "tienda.online@samsung.com", "euStablished": true, "responsibleContactPersonName": "Samsung Electronics Iberia, S.A., Sociedad Unipersonal", "websiteUrl": "www.samsung.com/es", "address": {"__typename": "GraphqlManufacturerLegalContactAddress", "additionalDetails": null, "addressLine": "Parque Empresarial Omega, Edificio C, Avenida de Barajas, 32", "city": "Alcobendas (Madrid)", "country": "España", "zipCode": "28108"}, "euResponsibleContact": {"__typename": "GraphqlManufacturerLegalEuResponsibleContact", "address": {"__typename": "GraphqlManufacturerLegalContactAddress", "additionalDetails": null, "addressLine": null, "city": null, "country": null, "zipCode": null}, "email":
